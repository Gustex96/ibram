name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Altere para a branch principal do seu projeto se for diferente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Java (Necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Ou a versão específica que você está usando
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar o APK (Release)
        run: flutter build apk --release

      - name: Salvar o APK como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
